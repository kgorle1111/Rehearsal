[project]
name = "rehearsal"
version = "0.0.1"
description = "Idea rehearsal — deterministic guards, one structured LLM call, human-review-always-wins."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
rehearsal = "rehearsal.cli:main"
rehearsal-evals = "rehearsal.evals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rehearsal"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tools/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
exclude = ["frontend/", "tools/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
